server {
    listen 80;
    listen [::]:80;
    server_name torquegestao.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name torquegestao.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/torquegestao.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torquegestao.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 5M;

    # O front lê a URL da API deste arquivo (mesma origem, sem CORS).
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.TORQUE_API_URL = '/api';\n";
    }

    # Remove o prefixo /api e repassa para a API.
    location /api/ {
        proxy_pass http://127.0.0.1:8210/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
    }
}
