[tool.ruff]
line-length = 100
target-version = "py311"
# Migrations são geradas automaticamente pelo Alembic — não faz sentido
# lintar código que não escrevemos à mão.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # comprimento de linha: o formatador não é obrigatório nesta Sprint

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "seguranca: testes de segurança (token, injeção, RBAC) ligados ao mapeamento de riscos",
    "contrato: testes de contrato gerados a partir do OpenAPI (Schemathesis)",
    "smoke: verificação rápida e somente leitura de que o sistema responde",
    "aceitacao: cenários Dado/Quando/Então dos critérios de aceite dos requisitos",
    "desempenho: consultas por requisição e orçamento de tempo das listagens",
]

# Cobertura (pytest --cov=app). O CI falha se a cobertura de linhas e ramos
# do pacote app/ ficar abaixo de fail_under.
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/seed_demo.py"]  # dados fictícios de demonstração, sem regra de negócio

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
