[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# A URL real vem de app/config.py (variável de ambiente DATABASE_URL),
# lida dinamicamente em alembic/env.py — o valor abaixo é só um fallback
# e não deve ser usado em produção.
sqlalchemy.url = postgresql+psycopg2://torque:torque@db:5432/torque_gestao

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
