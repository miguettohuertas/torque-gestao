<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles/theme.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 20px; }
  .section { margin-bottom: 20px; }
  .label { font-size: 10px; font-weight: 600; color: #787872; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
         font-family: var(--font-sans); font-weight: 600; border: none; cursor: pointer;
         border-radius: var(--radius-md); transition: all var(--duration-base) var(--ease-out);
         white-space: nowrap; }

  /* Sizes */
  .btn-sm  { height: 40px; padding: 0 16px; font-size: 14px; }
  .btn-md  { height: 48px; padding: 0 20px; font-size: 15px; }
  .btn-lg  { height: 56px; padding: 0 28px; font-size: 16px; }

  /* Variants */
  .btn-primary  { background: #1B2B4B; color: #fff; }
  .btn-primary:hover { background: #243760; }

  .btn-accent   { background: #F0A500; color: #1B2B4B; }
  .btn-accent:hover { background: #e09500; }

  .btn-secondary { background: #f0f3f9; color: #1B2B4B; border: 1.5px solid #bbc9e4; }
  .btn-secondary:hover { background: #dde4f1; }

  .btn-ghost { background: transparent; color: #1B2B4B; border: 1.5px solid #d8d8d3; }
  .btn-ghost:hover { background: #f5f5f2; }

  .btn-danger { background: #ef4444; color: #fff; }
  .btn-danger:hover { background: #dc2626; }

  .btn-disabled { background: #ebebе7; color: #9a9a94; cursor: not-allowed; }

  .dot { width: 8px; height: 8px; background: currentColor; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <div class="section">
    <div class="label">Primário — Ações principais</div>
    <div class="btn-row">
      <button class="btn btn-primary btn-lg">Criar Ordem de Serviço</button>
      <button class="btn btn-primary btn-md">Nova OS</button>
      <button class="btn btn-primary btn-sm">Confirmar</button>
    </div>
  </div>
  <div class="section">
    <div class="label">Acento âmbar — CTAs destacados</div>
    <div class="btn-row">
      <button class="btn btn-accent btn-lg">Aprovar Orçamento</button>
      <button class="btn btn-accent btn-md">Aprovar</button>
      <button class="btn btn-accent btn-sm">Ver</button>
    </div>
  </div>
  <div class="section">
    <div class="label">Secundário · Ghost · Danger · Desabilitado</div>
    <div class="btn-row">
      <button class="btn btn-secondary btn-md">Editar</button>
      <button class="btn btn-ghost btn-md">Cancelar</button>
      <button class="btn btn-danger btn-md">Excluir</button>
      <button class="btn btn-disabled btn-md" disabled>Indisponível</button>
    </div>
  </div>
</body>
</html>
