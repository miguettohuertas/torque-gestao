<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles/theme.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 20px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .swatch { flex: 1; height: 48px; border-radius: var(--radius-sm); display: flex; align-items: flex-end; padding: 4px 6px; }
  .swatch span { font-size: 10px; font-weight: 600; opacity: 0.85; }
  .label { font-size: 11px; font-weight: 600; color: #5e5e59; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="label">Primário — #1B2B4B</div>

  <div class="swatch" style="background:#1B2B4B; outline: 2.5px solid #F0A500; outline-offset: 2px"><span style="color:#fff">800★</span></div>
  <div class="swatch" style="background:#243760"><span style="color:#fff">700</span></div>
  <div class="swatch" style="background:#2e4578"><span style="color:#fff">600</span></div>

  <div class="swatch" style="background:#dde4f1"><span style="color:#111">100</span></div>
  <div class="swatch" style="background:#f0f3f9; border:1px solid #ddd"><span style="color:#111">50</span></div>
</div>

</body>
</html>
