<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles/theme.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #f5f5f2; padding: 0; color: #1c1c1a; display: flex; height: 340px; overflow: hidden; }
  .sidebar {
    width: 220px; background: #1B2B4B; display: flex; flex-direction: column;
    padding: 0; flex-shrink: 0; overflow: hidden;
  }
  .logo-area { padding: 20px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .logo-text { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
  .logo-sub { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 500; margin-top: 2px; }
  .nav-section { padding: 16px 12px 8px; }
  .nav-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; padding: 0 8px; margin-bottom: 4px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 8px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.65);
    cursor: pointer; transition: all 150ms; margin-bottom: 2px;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .nav-item.active { background: rgba(240,165,0,0.15); color: #F0A500; font-weight: 600; }
  .nav-item .icon { width: 18px; text-align: center; font-size: 15px; flex-shrink: 0; }
  .badge { background: #F0A500; color: #1B2B4B; font-size: 10px; font-weight: 700; border-radius: 9999px; padding: 1px 6px; margin-left: auto; }
  .user-area { margin-top: auto; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; background: #F0A500; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #1B2B4B; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 600; color: #fff; }
  .user-role { font-size: 11px; color: rgba(255,255,255,0.4); }
  .main { flex: 1; padding: 20px; overflow: auto; background: #f5f5f2; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .page-title { font-size: 22px; font-weight: 700; color: #1B2B4B; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 18px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
  .btn-primary { background: #1B2B4B; color: #fff; }
  .btn-accent { background: #F0A500; color: #1B2B4B; }
</style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-area">
      <div class="logo-text">Torque</div>
      <div class="logo-sub">Gestão de Oficina</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Principal</div>
      <div class="nav-item active"><span class="icon">▦</span> Painel<span class="badge">14</span></div>
      <div class="nav-item"><span class="icon">📋</span> Ordens de Serviço</div>
      <div class="nav-item"><span class="icon">🚗</span> Veículos</div>
      <div class="nav-item"><span class="icon">👥</span> Clientes</div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Gestão</div>
      <div class="nav-item"><span class="icon">🔧</span> Equipe</div>
      <div class="nav-item"><span class="icon">📦</span> Estoque</div>
      <div class="nav-item"><span class="icon">💰</span> Financeiro</div>
      <div class="nav-item"><span class="icon">⚙️</span> Configurações</div>
    </div>
    <div class="user-area">
      <div class="avatar">RG</div>
      <div>
        <div class="user-name">Roberto G.</div>
        <div class="user-role">Administrador</div>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="top-bar">
      <div class="page-title">Painel</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary">+ Nova OS</button>
        <button class="btn btn-accent">Relatório</button>
      </div>
    </div>
    <div style="font-size:13px;color:#787872">Visão geral da oficina — hoje, 22 abr 2026</div>
  </div>
</body>
</html>
