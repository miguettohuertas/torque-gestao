<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles/theme.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; padding: 20px; }
  .row { display: flex; gap: 6px; margin-bottom: 6px; }
  .swatch { flex: 1; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: flex-end; padding: 4px 6px; }
  .swatch span { font-size: 10px; font-weight: 600; }
  .label { font-size: 11px; font-weight: 600; color: #5e5e59; margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .sem-row { display: flex; gap: 8px; }
  .sem { flex: 1; border-radius: var(--radius-md); overflow: hidden; }
  .sem-top { height: 32px; }
  .sem-mid { height: 20px; }
  .sem-bot { height: 28px; padding: 4px 8px; font-size: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="label">Neutros</div>
<div class="row">
  <div class="swatch" style="background:#1c1c1a"><span style="color:#fff">900</span></div>
  <div class="swatch" style="background:#2e2e2b"><span style="color:#fff">800</span></div>
  <div class="swatch" style="background:#444440"><span style="color:#fff">700</span></div>
  <div class="swatch" style="background:#5e5e59"><span style="color:#fff">600</span></div>
  <div class="swatch" style="background:#787872"><span style="color:#fff">500</span></div>
  <div class="swatch" style="background:#9a9a94"><span style="color:#111">400</span></div>
  <div class="swatch" style="background:#bcbcb6"><span style="color:#111">300</span></div>
  <div class="swatch" style="background:#d8d8d3"><span style="color:#111">200</span></div>
  <div class="swatch" style="background:#ebebе7; border:1px solid #ddd"><span style="color:#111">100</span></div>
  <div class="swatch" style="background:#f5f5f2; border:1px solid #ddd"><span style="color:#111">50</span></div>
  <div class="swatch" style="background:#fff; border:1px solid #ddd"><span style="color:#111">0</span></div>
</div>
<div class="label" style="margin-top:12px">Semânticas</div>
<div class="sem-row">
  <div class="sem">
    <div class="sem-top" style="background:#22c55e"></div>
    <div class="sem-mid" style="background:#dcfce7"></div>
    <div class="sem-bot" style="background:#166534; color:#fff">Sucesso</div>
  </div>
  <div class="sem">
    <div class="sem-top" style="background:#f59e0b"></div>
    <div class="sem-mid" style="background:#fef3c7"></div>
    <div class="sem-bot" style="background:#92400e; color:#fff">Atenção</div>
  </div>
  <div class="sem">
    <div class="sem-top" style="background:#ef4444"></div>
    <div class="sem-mid" style="background:#fee2e2"></div>
    <div class="sem-bot" style="background:#991b1b; color:#fff">Erro</div>
  </div>
  <div class="sem">
    <div class="sem-top" style="background:#3b82f6"></div>
    <div class="sem-mid" style="background:#dbeafe"></div>
    <div class="sem-bot" style="background:#1e40af; color:#fff">Info</div>
  </div>
</div>
</body>
</html>
