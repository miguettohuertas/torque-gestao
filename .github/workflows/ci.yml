name: API e front-end CI

# Pipeline de qualidade do Torque Gestão. A cada push ou pull request que
# mexa no back-end ou no front-end, roda:
#
#   1. lint-and-test  — ruff + pytest com SQLite em memória e cobertura mínima
#                       (fail_under em apps/api/pyproject.toml). Rápido, é o
#                       primeiro feedback do PR.
#   2. api-postgres   — a MESMA suíte do pytest contra um PostgreSQL 16 real,
#                       o banco usado em produção (pega diferenças que o
#                       SQLite esconde, como chaves estrangeiras e tipos).
#   3. frontend       — testes unitários do cliente HTTP (node:test) e o
#                       fluxo integrado no navegador (Playwright) contra a API
#                       real com PostgreSQL.
#
# Estratégia completa e como rodar localmente: docs/testes.md.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/prototype/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/prototype/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + testes + cobertura (apps/api, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes com cobertura (pytest)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api
          path: apps/api/coverage.xml

  api-postgres:
    name: Testes da API contra PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: torque
          POSTGRES_PASSWORD: torque
          POSTGRES_DB: torque_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torque -d torque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://torque:torque@localhost:5432/torque_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations do Alembic aplicam do zero no PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://torque:torque@localhost:5432/torque_test
          JWT_SECRET_KEY: ci-only-not-a-production-secret
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Testes (pytest)
        run: pytest -v

  frontend:
    name: Front-end e fluxo integrado
    # Versão fixa: o Playwright não suporta o Ubuntu 26.04 que o ubuntu-latest passou a usar.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/prototype
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: torque
          POSTGRES_PASSWORD: torque
          POSTGRES_DB: torque_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torque -d torque_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TORQUE_E2E_POSTGRES_URL: postgresql+psycopg2://torque:torque@localhost:5432/torque_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/prototype/package-lock.json
      - run: pip install -r ../api/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/prototype/test-results/
