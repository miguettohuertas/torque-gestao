name: API e front-end CI

# Roda lint (ruff) e a suíte de testes (pytest) do apps/api a cada push ou
# pull request que mexa no back-end, conforme o entregável técnico da Fase 5
# (docs/academic/documentacao-mvp1.tex, Seção 2.4) — adiantado para o início
# da Sprint 1 para o time já trabalhar com CI verde desde o primeiro PR.
#
# Os testes usam SQLite em memória (ver apps/api/tests/conftest.py), então
# este workflow não depende de um serviço de PostgreSQL: mais rápido e sem
# partes móveis extras para o time recém começando com a stack.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/prototype/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/prototype/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + testes (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.6.9

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        run: pytest -v

  frontend:
    name: Front-end e fluxo integrado
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prototype
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/prototype/package-lock.json
      - run: pip install -r ../api/requirements.txt
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/prototype/test-results/
